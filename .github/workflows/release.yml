name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tag matches package.json and the changelog has a section for it
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version v$version" >&2
            exit 1
          fi
          # The heading must carry a release date: "## [0.1.0] - Unreleased" is not releasable.
          if ! grep -qxE "## \\[${version//./\\.}\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated section '## [$version] - YYYY-MM-DD'" >&2
            exit 1
          fi

  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Trusted publishing needs npm >= 11.5.1, which ships with Node 24.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache in the publishing job, so a poisoned cache can't reach a release.
          package-manager-cache: false
      - run: npm ci
      - name: Publish to npm (trusted publishing, no token)
        run: npm publish --provenance --access public
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          notes="$(awk -v v="## [$version]" 'index($0, v) == 1 { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" --notes "$notes"
